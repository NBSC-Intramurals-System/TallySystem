<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intramurals Tally Sheet</title>
<script>
  /* Apply the saved theme before the page paints, so it doesn't flash */
  (function(){ try{ var t = localStorage.getItem("intramurals-theme");
    if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  }catch(e){} })();
</script>
<link rel="stylesheet" href="style.css">
<style>
  /* Institute management additions (kept here so style.css stays untouched) */
  .inst-card{position:relative;}
  .inst-del{position:absolute;top:8px;right:8px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(128,128,128,.18);color:inherit;cursor:pointer;line-height:1;font-size:12px;}
  .inst-del:hover{background:#d9534f;color:#fff;}
  .inst-edit{position:absolute;bottom:10px;right:10px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(128,128,128,.18);color:inherit;cursor:pointer;line-height:1;font-size:13px;}
  .inst-edit:hover,.inst-edit.on{background:var(--c);color:#fff;}
  .inst-edit-panel{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-2px 0 12px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);}
  .inst-color{width:26px;height:26px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;}
  .edit-color{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);}
  #addInstBtn{margin:4px 0 16px;}
  .inst-pic-btn,.inst-pic-rm{height:26px;border:0;border-radius:13px;background:rgba(128,128,128,.18);color:inherit;cursor:pointer;font-size:12px;line-height:26px;padding:0 10px;}
  .inst-pic-btn:hover{background:var(--c);color:#fff;}
  .inst-pic-rm:hover{background:#d9534f;color:#fff;}
  .inst-badge{width:60px;height:60px;border-radius:16px;font-size:24px;margin-bottom:14px;}
  .inst-badge.has-img{background-size:cover;background-position:center;background-repeat:no-repeat;color:transparent;}
  .rank-avatar{width:60px;height:60px;border-radius:16px;background:var(--c);background-size:cover;background-position:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.18);}
  .rank-avatar.has-img{color:transparent;}
  .inst-name[readonly]{border-bottom-color:transparent;cursor:default;}
  .inst-save{margin-left:auto;height:26px;border:0;border-radius:13px;background:var(--c);color:#fff;cursor:pointer;font-size:12px;font-weight:600;line-height:26px;padding:0 14px;}
  .inst-save:disabled{opacity:.75;cursor:default;}

  /* Move event up / down */
  .row-actions{display:flex;align-items:center;justify-content:flex-end;gap:2px;}
  .mv-row{display:none;background:transparent;border:none;color:var(--ink-dim);cursor:pointer;font-size:13px;line-height:1;padding:4px;border-radius:6px;transition:color .15s ease;}
  body.reorder .mv-row{display:inline-block;}
  .mv-row:hover:not(:disabled){color:var(--accent);}
  .mv-row:disabled{opacity:.25;cursor:default;}
  #reorderBtn.on{border-color:var(--accent);color:var(--accent);}

  /* Medal icons (gold / silver / bronze) */
  .medal-ico{display:block;flex-shrink:0;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35));}
  .pt-pill{display:inline-flex;align-items:center;gap:5px;}
  .medal-head{display:flex;align-items:center;gap:6px;}
  .cell-medal{display:none;}
  @media (max-width:640px){
    .row .medal-cell{display:flex;align-items:center;gap:8px;}
    .row .medal-cell::before{display:none;}
    .cell-medal{display:inline-flex;}
    .row .medal-cell select.medal{flex:1;min-width:0;}
  }

  /* Drag & drop reordering */
  .ev-cell{display:flex;align-items:center;gap:4px;min-width:0;}
  .ev-cell .ev-name{flex:1;min-width:0;}
  .drag-grip{flex-shrink:0;width:22px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--ink-dim);font-size:15px;line-height:1;letter-spacing:-2px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
  .drag-grip:hover{color:var(--accent);background:var(--panel-2);}
  .row.shiftable{transition:transform .15s ease;}
  .row.dragging{position:relative;z-index:20;background:var(--panel-2);box-shadow:0 10px 28px rgba(0,0,0,.35);outline:1px solid var(--accent);transition:none;cursor:grabbing;will-change:transform;}
  body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing;}
  @media (min-width:641px){
    body.reorder .row,body.reorder .cat-totals{grid-template-columns:1fr repeat(3,minmax(0,210px)) 124px;}
  }
  /* Reveal the winner */
  .overall-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .overall-head h2{margin:0;}
  .reveal-btn{border:0;border-radius:10px;padding:9px 15px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#f9e08a,#e2b643);color:#3a2a05;box-shadow:0 2px 10px rgba(232,182,76,.35);transition:transform .15s ease,box-shadow .15s ease;}
  .reveal-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(232,182,76,.5);}
  .reveal-btn:active{transform:none;}

  .reveal{position:fixed;inset:0;z-index:100;display:flex;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));background:rgba(5,8,16,.84);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow-y:auto;}
  .reveal[hidden]{display:none;}
  .reveal-card{position:relative;z-index:1;margin:auto;width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 20px 18px;box-shadow:var(--shadow-card),0 20px 60px rgba(0,0,0,.45);}
  .reveal-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(128,128,128,.18);color:inherit;cursor:pointer;font-size:13px;line-height:1;}
  .reveal-close:hover{background:#d9534f;color:#fff;}
  .reveal-title{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);font-weight:600;margin:0 40px 6px 2px;}
  .reveal-caption{min-height:30px;font-size:20px;font-weight:700;margin:0 2px 14px;letter-spacing:-.01em;}
  .reveal-actions{display:flex;justify-content:center;margin-top:6px;}
  .reveal-replay{background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:9px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit;}
  .reveal-replay:hover{border-color:var(--accent);color:var(--ink);}
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}

  .rv-row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;border:1px dashed var(--line);border-radius:14px;background:var(--panel-2);opacity:.4;}
  .rv-row.show{opacity:1;border-style:solid;animation:rvIn .7s cubic-bezier(.22,1,.36,1);}
  .rv-row:not(.show) .rv-main,.rv-row:not(.show) .rv-score{visibility:hidden;}
  .rv-rank{width:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rv-num{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 13px 'JetBrains Mono',monospace;background:var(--bg);border:1px solid var(--line);color:var(--ink-dim);}
  .rv-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
  .rv-main .rank-avatar{width:44px;height:44px;font-size:18px;border-radius:12px;}
  .rv-name{font-size:15px;min-width:0;overflow-wrap:anywhere;}
  .rv-score{font:700 22px 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  .rv-trophy{display:none;font-size:20px;}
  .rv-row.winner{background:linear-gradient(135deg,rgba(232,182,76,.24),var(--panel-2));border-color:var(--gold-fill);box-shadow:0 0 0 1px var(--gold-fill),0 0 34px rgba(232,182,76,.38);animation:rvGlow 1.8s ease-in-out infinite alternate;}
  .rv-row.winner .rv-trophy{display:inline;animation:rvPop .7s cubic-bezier(.22,1,.36,1);}
  @keyframes rvIn{0%{opacity:0;transform:translateY(28px) scale(.94);}60%{opacity:1;transform:translateY(-4px) scale(1.02);}100%{opacity:1;transform:none;}}
  @keyframes rvGlow{from{box-shadow:0 0 0 1px var(--gold-fill),0 0 18px rgba(232,182,76,.25);}to{box-shadow:0 0 0 1px var(--gold-fill),0 0 38px rgba(232,182,76,.55);}}
  @keyframes rvPop{0%{transform:scale(0) rotate(-30deg);}70%{transform:scale(1.3) rotate(8deg);}100%{transform:scale(1) rotate(0);}}
  @media (prefers-reduced-motion:reduce){.rv-row.show,.rv-row.winner,.rv-row.winner .rv-trophy{animation:none;}}
</style>
</head>
<body>
<!-- Medal gradients (gold / silver / bronze), reused by every category -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="mdl-gold-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf0a8"/><stop offset=".5" stop-color="#e6bf55"/><stop offset="1" stop-color="#bf9230"/></linearGradient>
    <linearGradient id="mdl-gold-face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6bf"/><stop offset=".55" stop-color="#f5d974"/><stop offset="1" stop-color="#e2b643"/></linearGradient>
    <linearGradient id="mdl-silver-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c4ccd6"/><stop offset="1" stop-color="#8e99a6"/></linearGradient>
    <linearGradient id="mdl-silver-face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e6ebf1"/><stop offset="1" stop-color="#b9c2cd"/></linearGradient>
    <linearGradient id="mdl-bronze-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7cdb4"/><stop offset=".5" stop-color="#d0865f"/><stop offset="1" stop-color="#9c5832"/></linearGradient>
    <linearGradient id="mdl-bronze-face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbddc9"/><stop offset=".55" stop-color="#e7ab88"/><stop offset="1" stop-color="#c47c55"/></linearGradient>
    <radialGradient id="mdl-shine" cx=".3" cy=".22" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
</svg>
<div class="wrap">
  <header>
    <div>
      <h1>Intramurals Tally Sheet</h1>
      <div class="sub">Assign medals per event — totals calculate automatically.</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <button class="reset-btn" id="reorderBtn" type="button" title="Show or hide the move up/down arrows">⇅ Reorder: Off</button>
      <button class="reset-btn theme-btn" id="themeBtn" type="button"></button>
      <button class="reset-btn" id="exportCsvBtn">Export CSV</button>
      <button class="reset-btn" id="resetBtn">Reset all</button>
    </div>
  </header>

  <div class="board" id="board"></div>
  <button class="add-cat" id="addInstBtn">+ Add institute</button>

  <div class="overall">

<div class="reveal" id="reveal" hidden role="dialog" aria-modal="true" aria-label="Reveal the winner">
  <div class="reveal-card">
    <button class="reveal-close" id="revealClose" type="button" aria-label="Close">✕</button>
    <div class="reveal-title">Overall standing</div>
    <div class="reveal-caption" id="revealCaption"></div>
    <div class="reveal-list" id="revealList"></div>
    <div class="reveal-actions"><button class="reveal-replay" id="revealReplay" type="button">↻ Replay</button></div>
  </div>
  <canvas id="confetti"></canvas>

<script>
const API_URL = "api.php";
const PALETTE = ["#4f9ddb","#e0b23f","#5fae72","#b479c9","#d97757","#3fb8af","#e06c9f","#8a9a5b"];

// ---- Backend calls ------------------------------------------------
async function apiGetState(){
  const res = await fetch(`${API_URL}?action=state`);
  if(!res.ok) throw new Error("bad response " + res.status);
  return await res.json();
}
async function apiPost(action, body={}){
  try{
    const res = await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({action, ...body})
    });
    if(!res.ok) throw new Error("request failed " + res.status);
    return await res.json();
  }catch(e){
    console.warn("API call failed:", action, e);
    return null;
  }
}
function debounce(fn, delay=500){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), delay); };
}
// ---- Default data (used when api.php is unreachable, and by Reset) --
function defaultState(){
  let n = 0;
  const mk = names => names.map(name=>({
    id:"e"+(++n), name, winners:{gold:null,silver:null,bronze:null}
  }));
  return {
    institutes: [
      {id:"i1", name:"Institute of Teacher Education", color:PALETTE[0]},
      {id:"i2", name:"Institute of Business Management", color:PALETTE[1]},
      {id:"i3", name:"Institute of Computer Studies", color:PALETTE[2]},
    ],
    categories: [
      {
        id:"c1", name:"Major Categories", collapsed:false,
        points:{gold:30, silver:20, bronze:10},
        events: mk([
          "Bench Cheering","Basketball Men","Basketball Women",
          "Dance Sports (Latin Formation)","Cheer Dance",
          "Volleyball Men","Volleyball Women"
        ])
      },
      {
        id:"c2", name:"Minor Categories", collapsed:false,
        points:{gold:15, silver:12, bronze:10},
        events: mk([
          "Chess Men (Individual)","Chess Women (Individual)",
          "Chess Men (Institute)","Chess Women (Institute)",
          "Mobile Legends Men (E-Sports)","Mobile Legends Women (E-Sports)",
          "Tekken Men (E-Sports)","Tekken Women (E-Sports)",
          "Pickleball Men","Pickleball Women","Pickleball Mixed",
          "Sepaktakraw Men","Sepaktakraw Women",
          "Table Tennis (Single Men)","Table Tennis (Single Women)",
          "Table Tennis (Double Men)","Table Tennis (Double Women)",
          "Taekwondo Men (Fin)","Taekwondo Men (Fly)","Taekwondo Men (Bantam)",
          "Taekwondo Men (Feather)","Taekwondo Men (Welter)","Taekwondo Men (Welter - Novice)",
          "Taekwondo Women (Fin)","Taekwondo Women (Fly)","Taekwondo Women (Bantam)",
          "Taekwondo Women (Feather)",
          "Ultimate Frisbee Mixed"
        ])
      },
      {
        id:"c3", name:"Traditional Games (Laro ng Lahi)", collapsed:false,
        points:{gold:10, silver:7, bronze:5},
        events: mk([
          "Tug of War Men","Tug of War Women",
          "Patintero Men","Patintero Women",
          "Sack Race Men","Sack Race Women"
        ])
      }
    ]
  };
}

let state = null;

// ---- Local save (keeps data after refresh / closing the browser) ----
const LS_KEY = "intramurals-tally-v1";
function saveLocal(){
  if(!state) return;
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      institutes: state.institutes,
      categories: state.categories.map(({collapsed, ...c})=>c)
    }));
  }catch(e){ console.warn("Could not save locally:", e); }
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.institutes) || !Array.isArray(d.categories)) return null;
    return { institutes: d.institutes, categories: d.categories.map(c=>({...c, collapsed:false})) };
  }catch(e){ return null; }
}

async function load(){
  try{
    const data = await apiGetState();
    state = {
      institutes: data.institutes,
      categories: data.categories.map(c => ({...c, collapsed:false}))
    };
  }catch(e){
    console.warn("Could not reach api.php, using data saved in this browser:", e);
    state = loadLocal() || defaultState();
  }
}

function uid(prefix){ return prefix + Math.random().toString(36).slice(2,9); }

function instituteScore(instId){
  let total = 0;
  state.categories.forEach(cat=>{
    total += categoryScoreFor(cat, instId);
  });
  return total;
}
function categoryScoreFor(cat, instId){
  let total = 0;
  cat.events.forEach(ev=>{
    if(ev.winners.gold === instId) total += Number(cat.points.gold)||0;
    if(ev.winners.silver === instId) total += Number(cat.points.silver)||0;
    if(ev.winners.bronze === instId) total += Number(cat.points.bronze)||0;
  });
  return total;
}

function render(){
  renderBoard();
  renderCategories();
  renderRanking();
}

const editingInst = new Set();   // institutes whose edit panel is open
function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  state.institutes.forEach(inst=>{
    const card = document.createElement('div');
    card.className = 'inst-card';
    card.style.setProperty('--c', inst.color);
    const score = instituteScore(inst.id);
    const initial = (inst.name.trim()[0] || "?").toUpperCase();
    card.innerHTML = `
      <button class="inst-edit ${editingInst.has(inst.id) ? 'on' : ''}" data-inst="${inst.id}" type="button" title="Edit photo / color">✎</button>
      <input type="file" class="inst-file" data-inst="${inst.id}" accept="image/*" hidden>
      <button class="inst-del" data-inst="${inst.id}" title="Delete institute">✕</button>
      <div class="inst-badge ${inst.image ? 'has-img' : ''}" data-inst="${inst.id}" ${inst.image ? `style="background-image:url('${escAttr(inst.image)}')"` : ''}>${inst.image ? '' : initial}</div>
      ${editingInst.has(inst.id) ? `<div class="inst-edit-panel">
        <button class="inst-pic-btn" type="button">${inst.image ? '🖼 Change ' : '🖼 Add '}</button>
        ${inst.image ? `<button class="inst-pic-rm" data-inst="${inst.id}" type="button">Remove </button>` : ''}
        <label class="edit-color">Color <input type="color" class="inst-color" data-inst="${inst.id}" value="${escAttr(inst.color)}"></label>
        <button class="inst-save" data-inst="${inst.id}" type="button">Save</button>
      </div>` : ''}
      <input class="inst-name" value="${escAttr(inst.name)}" data-inst="${inst.id}" ${editingInst.has(inst.id) ? '' : 'readonly tabindex="-1"'}>
      <div class="inst-score">${score}</div>
      <div class="inst-score-label">Total points</div>
    `;
    board.appendChild(card);
  });

  // delete institute
  board.querySelectorAll('.inst-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const inst = state.institutes.find(i=>i.id===btn.dataset.inst);
      if(!inst) return;
      if(!confirm(`Delete "${inst.name}"? Any medals it won will be cleared from all events.`)) return;
      state.institutes = state.institutes.filter(i=>i.id!==inst.id);
      state.categories.forEach(c=>c.events.forEach(ev=>{
        ['gold','silver','bronze'].forEach(m=>{ if(ev.winners[m]===inst.id) ev.winners[m]=null; });
      }));
      render();
      apiPost('remove_institute', {id: inst.id});
    });
  });

  // institute picture (button or click on the badge)
  board.querySelectorAll('.inst-edit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.inst;
      const opening = !editingInst.has(id);
      if(opening) editingInst.add(id); else editingInst.delete(id);
      renderBoard();
      if(opening){
        const nameInp = document.querySelector(`.inst-name[data-inst="${id}"]`);
        if(nameInp){ nameInp.focus(); nameInp.setSelectionRange(nameInp.value.length, nameInp.value.length); }
      }
    });
  });
  board.querySelectorAll('.inst-save').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const inst = state.institutes.find(i=>i.id===btn.dataset.inst);
      if(!inst) return;
      btn.disabled = true;
      saveLocal();
      await Promise.all([
        apiPost('update_institute_name',  {id: inst.id, name: inst.name}),
        apiPost('update_institute_color', {id: inst.id, color: inst.color}),
        apiPost('update_institute_image', {id: inst.id, image: inst.image || ''})
      ]);
      btn.textContent = 'Saved ✓';
      setTimeout(()=>{ editingInst.delete(inst.id); renderBoard(); }, 700);
    });
  });
  board.querySelectorAll('.inst-pic-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      el.closest('.inst-card').querySelector('.inst-file').click();
    });
  });
  board.querySelectorAll('.inst-file').forEach(inp=>{
    inp.addEventListener('change', async e=>{
      const file = e.target.files[0];
      if(!file) return;
      const inst = state.institutes.find(i=>i.id===e.target.dataset.inst);
      try{
        inst.image = await resizeImage(file, 160);
      }catch(err){ alert('Could not read that image. Please try another file.'); return; }
      render();
      apiPost('update_institute_image', {id: inst.id, image: inst.image});
    });
  });
  board.querySelectorAll('.inst-pic-rm').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const inst = state.institutes.find(i=>i.id===btn.dataset.inst);
      inst.image = null;
      render();
      apiPost('update_institute_image', {id: inst.id, image: ''});
    });
  });

  // change institute color
  board.querySelectorAll('.inst-color').forEach(inp=>{
    inp.addEventListener('input', e=>{
      e.target.closest('.inst-card').style.setProperty('--c', e.target.value);
    });
    inp.addEventListener('change', e=>{
      const inst = state.institutes.find(i=>i.id===e.target.dataset.inst);
      inst.color = e.target.value;
      render();
      apiPost('update_institute_color', {id: inst.id, color: inst.color});
    });
  });

  // rename institute
  board.querySelectorAll('.inst-name').forEach(inp=>{
    inp.addEventListener('input', e=>{

// Crop to a centered square and shrink, so the saved picture stays small
function resizeImage(file, size){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const side = Math.min(img.width, img.height);
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      canvas.getContext('2d').drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}

// ---- Medal icons: round metallic medal with a laurel wreath ----------
function makeLaurel(color){
  const R = 29;
  const pt = (deg, r)=>{ const a = deg*Math.PI/180; return [50 + r*Math.cos(a), 50 + r*Math.sin(a)]; };
  const f = n => n.toFixed(1);
  const [sx, sy] = pt(114, R), [ex, ey] = pt(192, R);
  let branch = `<path d="M${f(sx)} ${f(sy)} A${R} ${R} 0 0 1 ${f(ex)} ${f(ey)}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linecap="round"/>`;
  for(let k = 0; k < 7; k++){
    const deg = 122 + k*10.5;
    [[R + 3.2, -38], [R - 3.2, 38]].forEach(([r, off])=>{
      const [cx, cy] = pt(deg, r);
      branch += `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="4.6" ry="1.9" fill="${color}" transform="rotate(${f(deg - 90 + off)} ${f(cx)} ${f(cy)})"/>`;
    });
  }
  return `<g>${branch}</g><g transform="translate(100 0) scale(-1 1)">${branch}</g>`;
}
const MEDALS = {
  gold:   { rim:'mdl-gold-rim',   face:'mdl-gold-face',   edge:'#b8902c', laurel: makeLaurel('#c09a35') },
  silver: { rim:'mdl-silver-rim', face:'mdl-silver-face', edge:'#8e99a6', laurel: makeLaurel('#9aa5b3') },
  bronze: { rim:'mdl-bronze-rim', face:'mdl-bronze-face', edge:'#9c5832', laurel: makeLaurel('#b06f48') }
};
function medalSvg(kind, size=20){
  const m = MEDALS[kind];
  return `<svg class="medal-ico" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="48" fill="url(#${m.rim})"/>
    <circle cx="50" cy="50" r="43" fill="url(#${m.face})" stroke="${m.edge}" stroke-opacity=".45" stroke-width="1"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.2"/>
    ${m.laurel}
    <circle cx="50" cy="50" r="43" fill="url(#mdl-shine)"/>
  </svg>`;
}

// Move an event inside its category: 'up', 'down' (one step), 'top' or 'bottom'
function moveEvent(cat, ev, where){
  const i = cat.events.findIndex(x=>x.id === ev.id);
  const last = cat.events.length - 1;
  const j = where === 'up' ? i - 1 : where === 'down' ? i + 1 : where === 'top' ? 0 : last;
  if(i < 0 || j < 0 || j > last || j === i) return;
  const [item] = cat.events.splice(i, 1);
  cat.events.splice(j, 0, item);
  saveLocal();
  render();
  apiPost('move_event', {id: ev.id, direction: where});
}

// Drag & drop: hold the ⋮⋮ handle and drag an event to a new spot in its category
function startDrag(e, row, cat, ev){
  if(e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const list = row.parentElement;
  const rs = [...list.children].filter(el=> el.classList.contains('row') && !el.classList.contains('head'));
  const fromIdx = rs.indexOf(row);
  if(fromIdx < 0) return;

  const sy = window.scrollY;
  const centers = rs.map(r=>{ const b = r.getBoundingClientRect(); return b.top + sy + b.height/2; });
  const dragH = row.getBoundingClientRect().height;
  const startPageY = e.clientY + sy;
  let lastClientY = e.clientY, toIdx = fromIdx, raf = 0;

  row.classList.add('dragging');
  rs.forEach(r=>{ if(r !== row) r.classList.add('shiftable'); });
  document.body.classList.add('is-dragging');

  function update(){
    const dy = (lastClientY + window.scrollY) - startPageY;
    row.style.transform = `translateY(${dy}px)`;
    const c = centers[fromIdx] + dy;
    let t = 0;
    centers.forEach((cc, k)=>{ if(k !== fromIdx && cc < c) t++; });
    toIdx = t;
    rs.forEach((r, k)=>{
      if(k === fromIdx) return;
      let shift = 0;
      if(fromIdx < toIdx && k > fromIdx && k <= toIdx) shift = -dragH;
      else if(fromIdx > toIdx && k >= toIdx && k < fromIdx) shift = dragH;
      r.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  }
  // auto-scroll the page when the pointer is near the top / bottom edge
  function tick(){
    const margin = 70;
    let d = 0;
    if(lastClientY < margin) d = -Math.ceil((margin - lastClientY) / 5);
    else if(lastClientY > window.innerHeight - margin) d = Math.ceil((lastClientY - (window.innerHeight - margin)) / 5);
    if(d){ window.scrollBy(0, d); update(); }
    raf = requestAnimationFrame(tick);
  }
  function finish(commit){
    cancelAnimationFrame(raf);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    document.body.classList.remove('is-dragging');
    if(commit && toIdx !== fromIdx){
      const [item] = cat.events.splice(fromIdx, 1);
      cat.events.splice(toIdx, 0, item);
      saveLocal();
      render();
      apiPost('move_event', {id: ev.id, direction: 'to', position: toIdx});
    }else{
      row.classList.remove('dragging');
      rs.forEach(r=>{ r.classList.remove('shiftable'); r.style.transform = ''; });
    }
  }
  function onMove(e2){ lastClientY = e2.clientY; update(); }
  function onUp(){ finish(true); }
  function onCancel(){ finish(false); }

  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
  raf = requestAnimationFrame(tick);
}

  document.body.appendChild(a);

  URL.revokeObjectURL(url);
}

// ---- Reveal the winner ------------------------------------------------
const revealEl = document.getElementById('reveal');
const revealList = document.getElementById('revealList');
const revealCaption = document.getElementById('revealCaption');
const confettiCanvas = document.getElementById('confetti');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let revealTimers = [], confettiRaf = 0, revealRows = [];

function later(fn, ms){ revealTimers.push(setTimeout(fn, ms)); }
function stopReveal(){
  revealTimers.forEach(clearTimeout);
  revealTimers = [];
  cancelAnimationFrame(confettiRaf);
  confettiCanvas.getContext('2d').clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
}
function countUp(el, to, ms=900){
  if(reducedMotion || to === 0){ el.textContent = to; return; }
  const t0 = performance.now();
  (function f(now){
    const p = Math.min(1, (now - t0) / ms);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if(p < 1) requestAnimationFrame(f);
  })(t0);
}
function launchConfetti(){
  if(reducedMotion) return;
  const ctx = confettiCanvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth, H = window.innerHeight;
  confettiCanvas.width = W * dpr; confettiCanvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#f5d974','#e2b643','#6ee7d8','#ff7a90','#8ab4ff','#ffffff'];
  const parts = Array.from({length:150}, ()=>({
    x: W/2 + (Math.random() - .5) * 140, y: H * .42,
    vx: (Math.random() - .5) * 15, vy: -(Math.random() * 13 + 5),
    g: .35 + Math.random() * .15, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
    rot: Math.random() * 6.28, vr: (Math.random() - .5) * .3,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  let frame = 0;
  cancelAnimationFrame(confettiRaf);
  (function step(){
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    parts.forEach(p=>{
      p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if(p.y < H + 30){
        alive++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      }
    });
    if(alive > 0 && frame++ < 420) confettiRaf = requestAnimationFrame(step);
    else ctx.clearRect(0, 0, W, H);
  })();
}

function rankBadge(i){
  return i < 3 ? medalSvg(['gold','silver','bronze'][i], 36) : `<span class="rv-num">${i+1}</span>`;
}
function buildRevealList(rows){
  revealList.innerHTML = rows.map((r, i)=>{
    const img = r.inst.image;

    return `<div class="rv-row">

        <div class="rank-avatar ${img ? 'has-img' : ''}" style="--c:${r.inst.color};${img ? `background-image:url('${escAttr(img)}')` : ''}">${img ? '' : initial}</div>
        <div class="rv-name rank-name" style="--c:${r.inst.color}">${escHtml(r.inst.name)}</div>

function playReveal(){
  stopReveal();
  buildRevealList(revealRows);
  const els = [...revealList.children];
  const n = els.length;
  const max = revealRows[0].score;
  const step = reducedMotion ? 250 : 1000;
  const pause = reducedMotion ? 300 : 1700;
  revealCaption.textContent = n > 1 ? 'Drumroll…' : '';

  function revealRow(i){
    els[i].classList.add('show');
    countUp(els[i].querySelector('.rv-score'), revealRows[i].score);
    if(i !== 0) return;
    // finale: highlight everyone on the top score
    revealRows.forEach((r, k)=>{ if(r.score === max) els[k].classList.add('winner'); });
    const names = revealRows.filter(r=> r.score === max).map(r=> r.inst.name);
    revealCaption.textContent = names.length === 1 ? `🏆 ${names[0]} wins!` : `🤝 It's a tie: ${names.join(' & ')}`;
    launchConfetti();
  }

  let t = 700;
  for(let i = n - 1; i >= 0; i--){
    if(i === 0 && n > 1){
      later(()=>{ revealCaption.textContent = 'And the winner is…'; }, t);
      t += pause;
    }
    const idx = i;
    later(()=> revealRow(idx), t);
    t += step;
  }
}

function openReveal(){
  const rows = state.institutes
    .map(inst=>({inst, score: instituteScore(inst.id)}))
    .sort((a, b)=> b.score - a.score);
  if(!rows.length) return;
  if(rows[0].score <= 0){
    alert('No medals have been assigned yet. Pick some winners first, then reveal.');
    return;
  }
  revealRows = rows;
  revealEl.hidden = false;
  document.body.style.overflow = 'hidden';
  playReveal();
}
function closeReveal(){
  stopReveal();
  revealEl.hidden = true;
  document.body.style.overflow = '';
}
document.getElementById('revealBtn').addEventListener('click', openReveal);
document.getElementById('revealClose').addEventListener('click', closeReveal);
document.getElementById('revealReplay').addEventListener('click', playReveal);
revealEl.addEventListener('click', e=>{ if(e.target === revealEl) closeReveal(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && !revealEl.hidden) closeReveal(); });

const THEME_KEY = "intramurals-theme";
const systemLight = window.matchMedia("(prefers-color-scheme: light)");
function currentTheme(){
  return document.documentElement.getAttribute("data-theme") || (systemLight.matches ? "light" : "dark");
}
